name: Naukri Profile Update Tests - Every 4 Hours

on:
  schedule:
    # Runs at 12:00 AM, 4:00 AM, 8:00 AM, 12:00 PM, 4:00 PM, 8:00 PM UTC
    - cron: '0 0,4,8,12,16,20 * * *'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Verify Chrome & Driver
        run: |
          google-chrome --version
          chromedriver --version

      - name: Run @updateNaukriProfile tests
        working-directory: ./UI
        run: mvn clean test -Dcucumber.filter.tags="@updateNaukriProfile"
