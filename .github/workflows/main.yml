name: Naukri Profile Update Tests - Every 4 Hours

on:
  schedule:
    # Runs at 12:00 AM, 4:00 AM, 8:00 AM, 12:00 PM, 4:00 PM, 8:00 PM UTC
    - cron: '0 0,4,8,12,16,20 * * *'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install matching ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          DRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$MAJOR_VERSION")
          echo "Chrome version: $CHROME_VERSION"
          echo "Major version: $MAJOR_VERSION"
          echo "Matching driver: $DRIVER_VERSION"
          wget -q https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip
          unzip -o chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          chromedriver --version
      
      

      - name: Run @updateNaukriProfile tests
        working-directory: ./UI
        run: mvn clean test -Dcucumber.filter.tags="@updateNaukriProfile"
